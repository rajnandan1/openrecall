[package]
name = "openrecall"
version = "0.2.0"
edition = "2024"
description = "A recall layer for Claude Code: hands a session the right past context, fast"
repository = "https://github.com/rajnandan1/openrecall"
license = "MIT"

[dependencies]
regex = "1"
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
sha2 = "0.11.0"
